<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이크 권한</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #18181b;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 340px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 18px;
        line-height: 1.35;
      }

      p {
        margin: 0;
        color: #52525b;
        font-size: 13px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        height: 40px;
        margin-top: 18px;
        border: 0;
        border-radius: 10px;
        background: #18181b;
        color: #ffffff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
      }

      button:hover {
        background: #27272a;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .status {
        margin-top: 14px;
        min-height: 20px;
        color: #71717a;
        font-size: 12px;
      }

      .status.error {
        color: #dc2626;
      }

      .status.ok {
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>마이크 권한이 필요합니다</h1>
      <p>Chrome 권한 요청 창이 뜨면 허용을 눌러주세요. 허용되면 이 창은 자동으로 닫힙니다.</p>
      <button id="request-button" type="button">마이크 권한 요청</button>
      <div id="status" class="status">권한 요청을 준비 중입니다.</div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
